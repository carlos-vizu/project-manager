#      - "4200:80"
#    depends_on:
#      - backend
#    networks:
#      - project-network
#    volumes:
#      - frontend_node_modules:/app/node_modules

volumes:
  postgres_data:
  frontend_node_modules:
  frontend_dist:

networks:
  project-network:
    driver: bridge
